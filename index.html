<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Helper SAP</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="header">
    <img src="retina-1731498477.png" class="logo">
    <div>
        <h1>Email Helper SAP</h1>
        <p>Generatore automatico di email da screenshot SAP</p>
    </div>
</div>



<input type="file" id="imageInput" accept="image/*">

<br><br>

<button id="leggiSap">
📷 Leggi Screenshot SAP
</button>

<hr>

<h2>Dati trovati</h2>

<div id="risultato">

Nessuno screenshot analizzato.

</div>

<hr>

<h2>Template</h2>

<button id="privato">
Privato
</button>

<button id="azienda">
Azienda
</button>

<button id="agenzia">
Agenzia
</button>

<hr>

<h2>Email generata</h2>

<textarea id="emailFinale" rows="18"></textarea>

<br><br>

<button id="copia">

📋 Copia Email

</button>

</div>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="script.js"></script>


</body>
</html>
